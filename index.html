
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROHIT RACING</title>
<style>
body{margin:0;background:#182334;color:white;text-align:center;font-family:Arial}
h1{color:gold}
canvas{background:#579c62;width:95%;max-width:500px;border:4px solid white}
button{padding:15px 28px;margin:8px;border:0;border-radius:12px;background:gold;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🏎️ ROHIT RACING</h1>
<h3>Score: <span id="score">0</span></h3>
<canvas id="game" width="400" height="600"></canvas>
<br>
<button onclick="left()">⬅️</button>
<button onclick="start()">START / RESTART</button>
<button onclick="right()">➡️</button>
<p>Keyboard: Arrow Left / Arrow Right</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let x=180, enemies=[],score=0,playing=false,frame=0;
function car(x,y,color){
ctx.fillStyle=color;ctx.fillRect(x,y,40,65);
ctx.fillStyle="#bceaff";ctx.fillRect(x+7,y+9,26,18);
ctx.fillStyle="#111";ctx.fillRect(x-4,y+10,6,17);ctx.fillRect(x+38,y+10,6,17);
}
function draw(){
ctx.clearRect(0,0,400,600);
ctx.fillStyle="#555";ctx.fillRect(55,0,290,600);
ctx.fillStyle="white";
for(let y=frame%70-70;y<600;y+=70){
ctx.fillRect(148,y,5,35);ctx.fillRect(247,y,5,35);
}
car(x,510,"red");
enemies.forEach(e=>car(e.x,e.y,"blue"));
}
function start(){
x=180;enemies=[];score=0;frame=0;playing=true;
requestAnimationFrame(loop);
}
function left(){x=Math.max(60,x-35)}
function right(){x=Math.min(300,x+35)}
document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft"||e.key==="a")left();
if(e.key==="ArrowRight"||e.key==="d")right();
});
function loop(){
if(!playing)return;
frame++;
if(frame%65===0)enemies.push({x:65+Math.floor(Math.random()*3)*95,y:-70});
enemies.forEach(e=>e.y+=4);
enemies=enemies.filter(e=>e.y<650);
for(let e of enemies){
if(x<e.x+40&&x+40>e.x&&510<e.y+65&&575>e.y){
playing=false;
alert("GAME OVER! Your Score: "+score);
return;
}}
score++;
document.getElementById("score").textContent=score;
draw();
requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
